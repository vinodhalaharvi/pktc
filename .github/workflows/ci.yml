name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # The generated commands are run against a real kernel here. This
      # is the only place they can be checked: a golden test proves we
      # emitted what we meant, not that the kernel accepts it.
      - name: capture tooling
        run: sudo apt-get install -y tcpdump wireguard-tools

      - name: load tunnel modules
        run: sudo modprobe ip_gre ipip vxlan 8021q wireguard || true

      - name: which tunnel types this kernel offers
        run: |
          for k in gre gretap ipip vxlan vlan wireguard; do
            sudo ip link add name probe0 type $k 2>&1 | head -1 | sed "s/^/$k: /" || true
            sudo ip link del probe0 2>/dev/null || true
          done
        continue-on-error: true

      - name: kernel tests
        run: sudo -E $(which go) test -tags netns ./... 2>&1 | tee /tmp/netns.log

      - name: failing tests
        if: failure()
        run: grep -E '^\s*--- FAIL|FAIL' /tmp/netns.log || true
