name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # The generated commands are run against a real kernel here. This
      # is the only place they can be checked: a golden test proves we
      # emitted what we meant, not that the kernel accepts it.
      - name: capture tooling
        run: sudo apt-get install -y tcpdump

      - name: load tunnel modules
        run: sudo modprobe ip_gre ipip vxlan

      - name: kernel tests
        run: sudo -E $(which go) test -tags netns -v ./...
